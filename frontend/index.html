.fg{background:#d81e3b;color:#fff}

function mkHead(n){
  const clean = encodeURIComponent((n||'Steve').replace(/^\./, ''));
  return `<img src="https://mc-heads.net/avatar/${clean}/64" alt="${n}" style="width:100%;height:100%;display:block;border-radius:inherit;image-rendering:pixelated;" loading="lazy" onerror="this.onerror=null;this.src='https://minotar.net/helm/${clean}/64.png';">`;
}
let cur=(new URLSearchParams(window.location.search).get('mode')||window.location.hash.replace('#','')||'overall').toLowerCase();
let showUnranked = false;
function toggleUnrankedDirectory(){
  showUnranked = !showUnranked;
  draw();
}
const alt=p=>Math.min(8849,Math.round(p/3100*8849)).toLocaleString('en-US');
const MATC={Coal:'#6b7280',Iron:'#aeb4c0',Gold:'#f1b82d',Diamond:'#37c7e6',Ruby:'#e0314f',Netherite:'#8a6a82',Radiant:'#ff9be0',Bedrock:'#8d7bff'};
const EV='<svg viewBox="0 0 128 128"><polygon points="8,100 44,40 64,70 84,24 120,100" fill="#f5c542"/><polygon points="84,24 70,50 84,44 98,52" fill="#fff"/></svg>';

const HM='<svg class="hm" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,120 0,80 60,40 100,70 170,10 230,64 290,30 340,70 400,50 400,120" fill="#fff"/></svg>';
const mname=m=>m[0]==='overall'?'Everest · Overall':m[1],micon=m=>m[0]==='overall'?EV:ICON[m[0]];
const fl=document.getElementById('modes');
MODES.forEach((m,i)=>{const w=document.createElement('div');w.className='fw';w.dataset.id=m[0];
 w.innerHTML=`<div class="fo"><button type="button" class="fg" role="tab" data-m="${m[0]}"><span class="fi">${micon(m)}</span><span class="fn">${m[0]==='overall'?'Everest':m[1]}</span></button></div>`;fl.appendChild(w)});
fl.addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(t){cur=t.dataset.m;draw()}});
document.getElementById('scl').onclick=()=>fl.scrollBy({left:-260,behavior:'smooth'});document.getElementById('scr').onclick=()=>fl.scrollBy({left:260,behavior:'smooth'});
function draw(){
 const q = document.getElementById('q').value.trim().toLowerCase();
 fl.querySelectorAll('.fw').forEach(w => {
   const on = w.dataset.id === cur;
   w.classList.toggle('on', on);
   w.querySelector('.fg').setAttribute('aria-selected', on);
 });
 {
   const s = fl.querySelector('.fw.on');
   if (s && fl.scrollTo) fl.scrollTo({ left: s.offsetLeft - fl.clientWidth/2 + s.offsetWidth/2, behavior: 'smooth' });
 }

 const m = MODES.find(x => x[0] === cur);
 document.getElementById('ttl').textContent = (cur === 'overall' ? 'Overall' : m[1]) + ' trail';

 const hero = document.getElementById('hero');
 const listEl = document.getElementById('list');

 if (cur === 'overall') {
   let all = PL.slice().sort((a, b) => {
     if (a.isRanked && !b.isRanked) return -1;
     if (!a.isRanked && b.isRanked) return 1;
     if (a.isRanked && b.isRanked) {
       return (b.elo - a.elo) || (b.wins - a.wins) || (b.kills - a.kills);
     }
     return a.n.localeCompare(b.n);
   });

   if (q) all = all.filter(p => p.n.toLowerCase().includes(q));

   const rankedOnly = all.filter(p => p.isRanked);

   if (!q && rankedOnly.length >= 3) {
     const o = [1, 0, 2];
     hero.innerHTML = '<div class="pod3">' + o.map(k => {
       const p = rankedOnly[k];
       if (!p) return '';
       const pts = p.elo, i = rankIdx(pts), c = TH[i];
       return `
         <div class="pp p${k+1}" data-n="${p.n}" tabindex="0" role="button" aria-label="Open ${p.n} profile">
           <span class="pos">#${k+1}</span>
           ${k===0 ? '<span class="sm">SUMMIT · #1</span>' : ''}
           <div class="hd">${mkHead(p.n)}</div>
           <div class="pod-info">
             <b class="pod-name" title="${p.n}">${p.n}</b>
             <div class="pod-elo"><strong>${pts}</strong> <span>Elo</span></div>
             <div class="pod-tier">${c.name} · ${c.label}</div>
             <div class="pod-alt">${alt(pts)} m summit</div>
           </div>
           <div class="bd">${bd(i)}</div>
         </div>
       `;
     }).join('') + '</div>';
   } else if (!q && rankedOnly.length > 0) {
     const p = rankedOnly[0], pts = p.elo, i = rankIdx(pts);
     hero.innerHTML = `<div class="hero" data-n="${p.n}" tabindex="0" role="button" aria-label="Open ${p.n} profile">${HM}${EM}<div class="hl"><span class="sm">SUMMIT · #1</span><div class="hh"><span class="hf">${mkHead(p.n)}</span><div><b>${p.n}</b><small>${TH[i].name}</small></div></div><div class="alt"><strong>${pts}</strong> Elo<small>${TH[i].name} · ${TH[i].label}</small></div></div><div class="hb bd">${bd(i)}</div></div>`;
   } else {
     hero.innerHTML = '';
   }

   const rankedCards = rankedOnly.map((p, k) => {
     if (!q && k < (rankedOnly.length >= 3 ? 3 : 1)) return '';
     const pts = p.elo, i = rankIdx(pts), c = TH[i], nx = TH[i+1];
     const base = (c.pts === 0) ? 1000 : c.pts;
     const target = nx ? nx.pts : 3100;
     const f = nx ? Math.max(0, Math.min(100, Math.round((pts - base) / ((target - base) || 1) * 100))) : 100;
     const posNum = k + 1;
     return `<div class="pcard" style="--acc:${k===1?'#c5cdd6':k===2?'#cd7f32':MATC[c.m]}" data-n="${p.n}" tabindex="0" role="button" aria-label="Open ${p.n} profile"><span class="pos${k===1?' s2':k===2?' s3':''}">#${posNum}</span><span class="pf">${mkHead(p.n)}</span><div class="pi"><b>${p.n}</b><small style="font-weight:600;color:var(--text);">${c.name} · ${pts} Elo</small><div class="el" title="${nx?f+'% to '+nx.name:'Max rank'}"><i style="width:${f}%"></i></div><small style="color:var(--muted);">${alt(pts)} m · ${c.label}</small></div><span class="pb bd">${bd(i)}</span></div>`;
   }).filter(Boolean);

   const unrankedPlayers = all.filter(p => !p.isRanked);
   const unrankedCards = unrankedPlayers.map(p => {
     return `<div class="pcard unranked-card" style="--acc:#6b7280;opacity:0.65;" data-n="${p.n}" tabindex="0" role="button" aria-label="Open ${p.n} profile"><span class="pos" style="color:var(--muted);font-size:12px;">—</span><span class="pf">${mkHead(p.n)}</span><div class="pi"><b style="color:var(--muted);">${p.n}</b><small style="color:var(--muted);">Unranked</small><div class="el" title="Unranked"><i style="width:0%"></i></div><small style="color:var(--muted);">No duels played · No Elo</small></div><span class="pb bd" style="opacity:0.35;">${unrankedBadge}</span></div>`;
   });

   let combinedHtml = '';
   if (q) {
     combinedHtml = rankedCards.concat(unrankedCards).join('') || '<p class="sub">No players found matching your search.</p>';
   } else {
     combinedHtml = rankedCards.join('');
     if (unrankedPlayers.length > 0) {
       combinedHtml += `
         <div style="grid-column:1/-1;text-align:center;padding:22px 0 10px;">
           <button type="button" onclick="toggleUnrankedDirectory()" style="background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 22px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
             <span>${showUnranked ? 'Hide' : 'Show'} Unranked Players (${unrankedPlayers.length})</span>
             <span style="font-size:10px;opacity:0.6;">${showUnranked ? '▲' : '▼'}</span>
           </button>
         </div>
       `;
       if (showUnranked) {
         combinedHtml += unrankedCards.join('');
       }
     }
   }
   listEl.innerHTML = combinedHtml;

 } else {
   let kitDuelists = PL.filter(p => p.pts && p.pts[cur] !== undefined && p.pts[cur] !== null);
   kitDuelists.sort((a, b) => (b.pts[cur] - a.pts[cur]) || (b.wins - a.wins) || (b.kills - a.kills));

   if (q) kitDuelists = kitDuelists.filter(p => p.n.toLowerCase().includes(q));

   if (kitDuelists.length === 0) {
     hero.innerHTML = `
       <div class="empty-trail" style="text-align:center;padding:48px 24px;background:linear-gradient(180deg,rgba(30,24,38,0.7),rgba(18,16,24,0.9));border:1px dashed #3a3447;border-radius:20px;margin:16px 0;">
         <span style="display:inline-block;width:64px;height:64px;margin-bottom:12px;opacity:0.75;">${micon(m)}</span>

         <p style="color:#9ba3b2;font-size:14px;max-width:440px;margin:0 auto 16px;">Nobody has played this kit on the server yet. Jump in and duel to be the very first player on the summit!</p>
         <button type="button" onclick="copyServerIp()" style="background:#dc143c;color:#fff;border:none;padding:10px 22px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;box-shadow:0 4px 14px rgba(220,20,60,0.35);">Copy Server IP: mcnp.network</button>
       </div>
     `;
     listEl.innerHTML = '';
     return;
   }

   if (!q && kitDuelists.length > 0) {
     const p = kitDuelists[0], pts = p.pts[cur], i = rankIdx(pts), c = TH[i];
     hero.innerHTML = `<div class="hero" data-n="${p.n}" tabindex="0" role="button" aria-label="Open ${p.n} profile">${HM}${EM}<div class="hl"><span class="sm">SUMMIT · #1</span><div class="hh"><span class="hf">${mkHead(p.n)}</span><div><b>${p.n}</b><small style="font-weight:700;">${c.name}</small></div></div><div class="alt"><strong>${pts}</strong> Elo<small>${c.name} · ${c.label} (${alt(pts)} m)</small></div></div><div class="hb bd">${bd(i)}</div></div>`;
   } else {
     hero.innerHTML = '';
   }

   const minIdx = (!q && kitDuelists.length > 0) ? 1 : 0;
   const cards = kitDuelists.slice(minIdx);

   if (cards.length > 0) {
     listEl.innerHTML = cards.map((p, idx) => {
       const k = minIdx + idx;
       const pts = p.pts[cur], i = rankIdx(pts), c = TH[i], nx = TH[i+1];
       const base = (c.pts === 0) ? 1000 : c.pts;
       const target = nx ? nx.pts : 3100;
       const f = nx ? Math.max(0, Math.min(100, Math.round((pts - base) / ((target - base) || 1) * 100))) : 100;
       return `<div class="pcard" style="--acc:${k===1?'#c5cdd6':k===2?'#cd7f32':MATC[c.m]}" data-n="${p.n}" tabindex="0" role="button" aria-label="Open ${p.n} profile"><span class="pos${k===1?' s2':k===2?' s3':''}">#${k+1}</span><span class="pf">${mkHead(p.n)}</span><div class="pi"><b>${p.n}</b><small style="font-weight:600;color:var(--text);">${c.name} · ${pts} Elo</small><div class="el" title="${nx?f+'% to '+nx.name:'Max rank'}"><i style="width:${f}%"></i></div><small style="color:var(--muted);">${alt(pts)} m · ${c.label}</small></div><span class="pb bd">${bd(i)}</span></div>`;

let opener=null;const md=document.getElementById('md'),mb=document.getElementById('mb'),mx=document.getElementById('mx');
function showP(n, el) {
  const p = PL.find(x => x.n === n);
  if (!p) return;
  opener = el;

  const pos = m => {
    if (m === 'overall') {
      const ranked = PL.filter(x => x.isRanked && x.elo !== null);
      ranked.sort((a, b) => (b.elo - a.elo) || (b.wins - a.wins) || (b.kills - a.kills));
      const idx = ranked.indexOf(p);
      return idx !== -1 ? (idx + 1) : null;
    }
    const rankedInKit = PL.filter(x => x.pts && x.pts[m] !== undefined && x.pts[m] !== null);
    rankedInKit.sort((a, b) => (b.pts[m] - a.pts[m]) || (b.wins - a.wins) || (b.kills - a.kills));
    const idx = rankedInKit.indexOf(p);
    return idx !== -1 ? (idx + 1) : null;
  };

  const isPlayerRanked = p.isRanked && p.elo !== null;
  let ovHtml = '';
  if (isPlayerRanked) {
    const curOverall = p.elo;
    const oi = rankIdx(curOverall), oc = TH[oi], on = TH[oi+1];
    const obase = (oc.pts === 0) ? 1000 : oc.pts;
    const otarget = on ? on.pts : 3100;
    const of = on ? Math.max(0, Math.min(100, Math.round((curOverall - obase) / ((otarget - obase) || 1) * 100))) : 100;
    ovHtml = `<div class="ov"><span class="ob bd">${bd(oi)}</span><div style="flex:1;min-width:0"><small>Overall position</small><b>#${pos('overall')} in Everest</b><small>${oc.name} · ${curOverall} Elo · ${oc.label}</small><span class="pg"><i style="width:${of}%"></i></span><small>${on?of+'% to '+on.name+' ('+on.label+')':'Summit Rank'}</small></div></div>`;
  } else {
    ovHtml = `<div class="ov" style="opacity:0.8;"><span class="ob bd">${unrankedBadge}</span><div style="flex:1;min-width:0"><small>Overall position</small><b style="color:var(--t2);">Unranked</b><small style="color:var(--muted);">No ranked duels played yet</small><span class="pg"><i style="width:0%"></i></span><small style="color:var(--muted);">Duel on mcnp.network to earn your first rank</small></div></div>`;
  }

  // Filter to ONLY gamemodes in which this player is actually ranked!
  const rankedModes = MODES.slice(1).filter(m => p.pts && p.pts[m[0]] !== undefined && p.pts[m[0]] !== null);
  // Sort ranked modes by highest Elo descending (highest rank first)
  rankedModes.sort((a, b) => (p.pts[b[0]] - p.pts[a[0]]));

  let gmHtml = '';
  if (rankedModes.length > 0) {
    const gmCards = rankedModes.map(m => {
      const pt = p.pts[m[0]];
      const i = rankIdx(pt);
      const c = TH[i];
      return `<div class="gm" data-r="${i}" tabindex="0" role="button" aria-label="Open ${c.name} details"><span class="gi">${ICON[m[0]]}</span><div class="gt"><b>${m[1]}</b><small>#${pos(m[0])} in trail · <b>${pt} Elo</b></small><small class="rn">${c.name} (${c.label})</small></div><span class="gb bd">${bd(i)}</span></div>`;
    }).join('');
    gmHtml = `<h3 class="mh">Ranked Gamemodes (${rankedModes.length})</h3><div class="gms">${gmCards}</div>`;
  } else {
    gmHtml = `<h3 class="mh">Ranked Gamemodes (0)</h3><div class="empty-modes" style="text-align:center;padding:26px 18px;background:rgba(0,0,0,0.18);border-radius:14px;border:1px dashed var(--line);margin:10px 0;"><span style="display:inline-block;width:38px;height:38px;margin-bottom:8px;opacity:0.5;">${unrankedBadge}</span><h4 style="margin:0 0 6px;color:var(--text);font-size:16px;">No Ranked Gamemodes Yet</h4><p style="margin:0;color:var(--muted);font-size:13px;line-height:1.4;">This player has not played any ranked duels yet.<br>Duel on <b>mcnp.network</b> to enter kit rankings!</p></div>`;
  }

  const statsCard = (p.kills > 0 || p.wins > 0 || p.losses > 0 || p.deaths > 0) ? `
   <div class="kvs" style="margin:14px 0;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
     <div class="kv"><span>Kills / Deaths</span><b>${p.kills || 0} / ${p.deaths || 0} (${p.kd || '0.00'})</b></div>
     <div class="kv"><span>Win Rate</span><b>${p.winRate || '0.0'}% (${p.wins || 0}W - ${p.losses || 0}L)</b></div>
     <div class="kv"><span>Win Streak</span><b>${p.winStreak || 0} (Best: ${p.bestWinStreak || 0})</b></div>
   </div>` : '';

  mb.innerHTML = `<div class="ph"><span class="hd2">${mkHead(p.n)}</span><div><h2 id="mn">${p.n}</h2><small>Minecraft Nepal Duelist</small></div></div>${ovHtml}${statsCard}${gmHtml}`;
  md.hidden = false;
  document.body.style.overflow = 'hidden';
  mx.focus();
}
function showR(i, el) {
  opener = el;
  const r = TH[i], nx = TH[i+1], pv = TH[i-1], tiers = R.find(x => x[0] === r.m)[1].length;
  const row = (a, b) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`;
  mb.innerHTML = `
    <div class="ov" style="margin-top:0">
      <span class="ob bd" style="flex-basis:130px;width:130px">${bd(i)}</span>
      <div style="flex:1;min-width:0">
        <h2 id="mn" style="margin:0;font-size:26px">${r.name}</h2>
        <small>Rank Tier ${i+1} of ${TH.length} · <b style="color:var(--text);">${r.label}</b></small>
      </div>
    </div>
    <div class="kvs">
      ${row('Elo Requirement', r.label)}
      ${row('Default Start', r.m === 'Coal' && r.t === 1 ? '1,000 Elo (Starting rank for all duelists)' : r.pts + ' Elo')}
      ${row('Peak Altitude', alt(r.pts) + ' m')}
      ${row('Tier Material', r.m + ' (Tier ' + r.t + ' of ' + tiers + ')')}
      ${row('Next Rank', nx ? nx.name + ' · ' + nx.label : 'Bedrock · Maximum Summit')}
      ${row('Points to Next', nx ? (nx.pts - r.pts) + ' Elo needed' : 'None · At Highest Rank')}
      ${row('Previous Rank', pv ? pv.name + ' · ' + pv.label : 'Starting Rank')}
      ${row('Oxygen K-Factor', '±' + (r.kFactor || 28) + ' Elo per match')}
    </div>
  `;
  md.hidden = false;
  document.body.style.overflow = 'hidden';
  mx.focus();
}
function hideP(){md.hidden=true;document.body.style.overflow='';if(opener&&opener.focus)opener.focus()}
mx.onclick=hideP;md.addEventListener('click',e=>{if(e.target===md)hideP()});
const act=t=>{if(t.dataset.r!==undefined)showR(+t.dataset.r,t);else if(t.dataset.n)showP(t.dataset.n,t)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!md.hidden)hideP();else if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&(e.target.dataset.n||e.target.dataset.r!==undefined)){e.preventDefault();act(e.target)}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-r],[data-n]');if(t)act(t)});

async function syncWithOxygenApi(){
    const apiBase = (window.OXYGEN_CONFIG && window.OXYGEN_CONFIG.apiBaseUrl) || '';
    
    // 1. Sync live server status with multi-tiered fallback
    (async function refreshStatus() {
        const dot = document.getElementById('serverDot');
        const badge = document.getElementById('onlineBadge');

        function markOnline(count) {
            if (dot) dot.classList.remove('offline');
            if (badge) badge.innerText = (count !== undefined && count !== null && count > 0) ? `${count} Online` : 'Server Online';
        }
        function markOffline() {
            if (dot) dot.classList.add('offline');
            if (badge) badge.innerText = 'Offline';
        }

        // Try /api/status first
        try {
            const res = await fetch(`${apiBase}/api/status`, { signal: AbortSignal.timeout(3000) });
            if (res.ok) {
                const data = await res.json();
                if (data.status === 'online' || data.online) {
                    markOnline(data.onlinePlayers);
                    return;
                }
            }
        } catch (e) {}

        // Fallback 1: mcapi.us (Instant, reliable, CORS enabled)
        try {
            const res2 = await fetch('https://mcapi.us/server/status?ip=mcnp.network', { signal: AbortSignal.timeout(3000) });
            if (res2.ok) {
                const d2 = await res2.json();
                if (d2.online) {
                    markOnline(d2.players ? d2.players.now : null);
                    return;
                }
            }
        } catch (e2) {}

        // Fallback 2: mcsrvstat.us
        try {
            const res3 = await fetch('https://api.mcsrvstat.us/3/mcnp.network', { signal: AbortSignal.timeout(3500) });
            if (res3.ok) {
                const d3 = await res3.json();
                if (d3.online) {
                    markOnline(d3.players ? d3.players.online : null);
                    return;
                }
            }
        } catch (e3) {}

        markOffline();
    })();

    // 2. Fetch live Oxygen duelists with exact stats
    try {
        const res = await fetch(`${apiBase}/api/leaderboard?limit=100`, { signal: AbortSignal.timeout(4000) });
        if(res.ok){
            const liveDuelists = await res.json();
            if(liveDuelists && liveDuelists.length > 0){
                const liveMap = new Map();
                liveDuelists.forEach(d => liveMap.set(d.name.toLowerCase(), d));
                const seen = new Set();
                PL = PL.map(p => {
                    const d = liveMap.get(p.name.toLowerCase());
                    if (d) {
                        seen.add(d.name.toLowerCase());
                        return {
                            n: d.name,
                            uuid: d.uuid,
                            name: d.name,
                            elo: d.elo,
                            isRanked: d.isRanked !== undefined ? d.isRanked : (d.elo !== null),
                            pts: d.pts || {},
                            kills: d.kills || 0,
                            deaths: d.deaths || 0,
                            kd: d.kd || 0,
                            wins: d.wins || 0,
                            losses: d.losses || 0,
                            winRate: d.winRate || 0,
                            winStreak: d.winStreak || 0,
                            bestWinStreak: d.bestWinStreak || 0
                        };
                    }
                    return p;
                });
                for (const d of liveDuelists) {
                    if (!seen.has(d.name.toLowerCase())) {
                        PL.push({
                            n: d.name,
                            uuid: d.uuid,
                            name: d.name,
                            elo: d.elo,
                            isRanked: d.isRanked !== undefined ? d.isRanked : (d.elo !== null),
                            pts: d.pts || {},
                            kills: d.kills || 0,
                            deaths: d.deaths || 0,
                            kd: d.kd || 0,
                            wins: d.wins || 0,
                            losses: d.losses || 0,
                            winRate: d.winRate || 0,
                            winStreak: d.winStreak || 0,
                            bestWinStreak: d.bestWinStreak || 0
                        });
                    }
                }
                draw();
            }
        }
    } catch(e){
        console.warn('[Oxygen] Using bundled exact stats:', e);
    }
}

function copyServerIp(){
    const ip = 'mcnp.network';
    navigator.clipboard.writeText(ip).then(()=>{
        const toast = document.getElementById('toast');
        if(toast){
            toast.innerText = `Copied ${ip} to clipboard!`;
            toast.style.display = 'block';
            setTimeout(()=>toast.style.display='none', 2500);
        }
    }).catch(()=>{
        prompt('Copy server IP:', ip);
    });
}
