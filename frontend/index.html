async function syncWithOxygenApi(){
    const apiBase = (window.OXYGEN_CONFIG && window.OXYGEN_CONFIG.apiBaseUrl) || '';
    
    // 1. Sync live server status
    try {
        const res = await fetch(`${apiBase}/api/status`, { signal: AbortSignal.timeout(4000) });
        if(res.ok){
            const data = await res.json();
            const dot = document.getElementById('serverDot');
            const badge = document.getElementById('onlineBadge');
            if(data.status === 'online'){
                dot.classList.remove('offline');
                badge.innerText = data.onlinePlayers > 0 ? `${data.onlinePlayers} Online` : 'Server Online';
            } else {
                dot.classList.add('offline');
                badge.innerText = 'Offline';
            }
        }
    } catch(e){
        const dot = document.getElementById('serverDot');
        if(dot) dot.classList.add('offline');
    }

    // 2. Fetch live StrikePractice duelists
    try {
        const res = await fetch(`${apiBase}/api/leaderboard?limit=100`, { signal: AbortSignal.timeout(4000) });
        if(res.ok){
            const liveDuelists = await res.json();
            if(liveDuelists && liveDuelists.length > 0){
                const merged = liveDuelists.map(d => {
                    const existing = PL.find(p => p.n.toLowerCase() === d.name.toLowerCase());
                    let pts = (d.pts && typeof d.pts === 'object') ? d.pts : (existing ? existing.pts : {});
                    pts.overall = d.elo || 1000;

                    let hash = 0;
                    for (let i = 0; i < d.name.length; i++) hash = ((hash << 5) - hash) + d.name.charCodeAt(i);
                    const rngKit = (seed) => {
                        let s = (seed ^ Math.abs(hash)) | 0;
                        s = (s + 0x6D2B79F5) | 0;
                        let t = Math.imul(s ^ (s >>> 15), 1 | s);
                        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                        return (((t ^ (t >>> 14)) >>> 0) / 4294967296);
                    };

                    MODES.slice(1).forEach((m, idx) => {
                        if(pts[m[0]] === undefined){
                            const r = rngKit(200 + idx * 19);
                            const variance = (r * 0.3) - 0.15;
                            pts[m[0]] = Math.min(3100, Math.max(300, Math.round(((d.elo || 1000) * (1 + variance)) / 10) * 10));
                        }
                    });

                    return {
                        n: d.name,
                        uuid: d.uuid,
                        s: Math.min(1.0, (d.elo || 1000) / 2900),
                        pts: pts,
                        kills: d.kills,
                        deaths: d.deaths,
                        kd: d.kd,
                        wins: d.wins,
                        losses: d.losses,
                        winRate: d.winRate,
                        winStreak: d.winStreak,
                        bestWinStreak: d.bestWinStreak
                    };
                });

                PL = merged;
                draw();
            }
        }
    } catch(e){
        console.warn('[Oxygen] Running in offline fallback mode:', e);
    }
}
